<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
    <title>ธุลีเหนือสวรรค์ (Dust Above the Heavens) - E-Reader</title>

    <!-- PWA Settings for Mobile App Installation -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9a7432">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ธุลีเหนือสวรรค์">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Charm:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f5ec;
            --text: #2d2925;
            --title: #181410;
            --card-bg: #ede6d6;
            --card-border: #d8ceba;
            --accent: #9a7432;
            --accent-glow: rgba(154, 116, 50, 0.25);
            --quote-bg: #ece5d3;
            --quote-border: #b89758;
            --header-bg: rgba(248, 245, 236, 0.95);
            --header-border: #e2d7c3;
        }

        [data-theme="warm-dark"] {
            --bg: #191816;
            --text: #c8c2b7;
            --title: #ede6d8;
            --card-bg: #262421;
            --card-border: #3b3731;
            --accent: #cfa85e;
            --accent-glow: rgba(207, 168, 94, 0.25);
            --quote-bg: #22201d;
            --quote-border: #917540;
            --header-bg: rgba(25, 24, 22, 0.95);
            --header-border: #332f29;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #222222;
            --title: #0a0a0a;
            --card-bg: #f2f2f2;
            --card-border: #e0e0e0;
            --accent: #555555;
            --accent-glow: rgba(85, 85, 85, 0.2);
            --quote-bg: #f6f6f6;
            --quote-border: #999999;
            --header-bg: rgba(255, 255, 255, 0.95);
            --header-border: #eaeaea;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.95;
            font-size: 21px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--header-border);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .btn.active {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        .btn-install {
            background-color: var(--accent);
            color: #fff;
            border-color: var(--accent);
            border-radius: 20px;
            font-size: 12px;
            padding: 5px 10px;
            display: none;
            cursor: pointer;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 20px 80px 20px;
        }

        /* Cover Hero Section (At Chapter 1 header) */
        .vol-cover-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin: 0 0 32px 0;
            text-align: center;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .vol-cover-img-wrapper {
            display: inline-block;
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .vol-cover-img-wrapper:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 34px rgba(0,0,0,0.45);
        }

        .vol-cover-img {
            display: block;
            max-width: 260px;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .vol-cover-info {
            margin-top: 14px;
        }

        .vol-cover-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            background: var(--bg);
            border: 1px solid var(--card-border);
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .vol-cover-title {
            font-family: 'Charm', cursive, 'Sarabun', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--title);
            margin: 4px 0 6px 0;
            line-height: 1.3;
        }

        .vol-cover-desc {
            font-size: 14px;
            color: var(--text);
            opacity: 0.85;
            margin: 0;
            line-height: 1.6;
        }

        h1.chapter-title {
            font-size: 27px;
            color: var(--title);
            text-align: center;
            margin: 16px 0 28px 0;
            line-height: 1.4;
            font-weight: 700;
        }

        p {
            margin-bottom: 22px;
            text-indent: 1.8em;
            text-align: justify;
        }

        .divider {
            text-align: center;
            color: var(--accent);
            margin: 36px 0;
            letter-spacing: 8px;
            font-size: 18px;
            opacity: 0.8;
        }

        .quote-box {
            background-color: var(--quote-bg);
            border-left: 4px solid var(--quote-border);
            padding: 14px 18px;
            margin: 24px 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid var(--header-border);
            gap: 12px;
        }

        .nav-link {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .nav-link.next {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .nav-link:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Modal TOC */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        @media (min-width: 600px) {
            .modal {
                align-items: center;
            }
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            border-radius: 16px 16px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
        }

        @media (min-width: 600px) {
            .modal-content {
                border-radius: 16px;
                max-height: 80vh;
            }
        }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--header-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--title);
            background: var(--header-bg);
        }

        /* TOC Volume Sections & Collapsible Accordion */
        .toc-body {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toc-volume-card {
            flex-shrink: 0;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .toc-volume-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .toc-hero-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: var(--card-bg);
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background 0.2s ease;
        }

        .toc-hero-banner:hover {
            background: var(--quote-bg);
        }

        .toc-hero-cover-wrap {
            position: relative;
            width: 54px;
            height: 78px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            cursor: zoom-in;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toc-hero-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .toc-hero-cover-wrap .zoom-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 9px;
            text-align: center;
            padding: 1px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .toc-hero-details {
            flex: 1;
            min-width: 0;
        }

        .toc-hero-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toc-hero-title {
            font-family: 'Charm', cursive, 'Sarabun', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--title);
            margin: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toc-hero-sub {
            font-size: 12px;
            color: var(--text);
            opacity: 0.85;
            margin: 0;
        }

        .toc-vol-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--card-border);
            color: var(--accent);
            font-size: 12px;
            flex-shrink: 0;
            transition: transform 0.25s ease, background 0.2s ease;
        }

        .toc-volume-card.collapsed .toc-vol-toggle {
            transform: rotate(-90deg);
        }

        .toc-volume-card.collapsed .toc-list {
            display: none;
        }

        .toc-list {
            list-style: none;
            padding: 8px 12px 10px 12px;
            margin: 0;
            border-top: 1px dashed var(--card-border);
            background: var(--bg);
        }

        .toc-item {
            padding: 11px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 3px;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid var(--card-border);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toc-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .toc-item:hover, .toc-item.active {
            background: var(--card-bg);
            color: var(--accent);
            font-weight: 700;
            padding-left: 18px;
        }

        .reading-progress-bar {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            background: var(--accent);
            width: 0%;
            z-index: 9999;
            transition: width 0.1s linear;
        }

        /* Fullscreen Image Preview Lightbox */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(8px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            cursor: zoom-out;
        }

        .lightbox-modal.open {
            display: flex;
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.7);
            object-fit: contain;
            animation: zoomIn 0.25s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="reading-progress-bar" id="progressBar"></div>

    <header>
        <span class="brand" onclick="openToc()">📖 สารบัญ</span>
        <div class="controls">
            <button class="btn-install" id="btnInstall" onclick="installPWA()">📲 ติดตั้งแอป</button>
            <button class="btn" id="btn-sepia" onclick="changeTheme('sepia')">📜 ซีเปีย</button>
            <button class="btn" id="btn-dark" onclick="changeTheme('warm-dark')">🌙 มืดอุ่น</button>
            <button class="btn" id="btn-light" onclick="changeTheme('light')">☀️ สว่าง</button>
        </div>
    </header>

    <div class="container" id="readerArea">
        <!-- Chapter loaded dynamically -->
    </div>

    <!-- TOC Modal -->
    <div class="modal" id="tocModal" onclick="closeToc(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>📑 เลือกตอนอ่าน (ธุลีเหนือสวรรค์)</span>
                <div style="display: flex; gap: 8px;">
                    <button class="btn" onclick="forceRefresh()" title="ดึงตอนใหม่ล่าสุด">🔄 รีเฟรช</button>
                    <button class="btn" onclick="closeToc()">✕ ปิด</button>
                </div>
            </div>

            <div class="toc-body" id="tocContainer">
                <!-- Volume cards and chapters rendered dynamically -->
            </div>
        </div>
    </div>

    <!-- Lightbox for Cover Preview -->
    <div class="lightbox-modal" id="coverLightbox" onclick="closeCoverLightbox()">
        <img src="Cover_Vol1.png" alt="หน้าปก เล่มที่ 1 ขนาดเต็ม" class="lightbox-img">
    </div>

    <script>
        let allChapters = [];
        let currentChapIndex = 0;
        let deferredPrompt;

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('SW Registered');
                        reg.update();
                    })
                    .catch(err => console.log('SW Error:', err));
            });
        }

        // PWA Install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('btnInstall');
            if (btn) btn.style.display = 'inline-block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('btnInstall').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        // Background update check (Stale-While-Revalidate pattern)
        async function backgroundSyncChapters() {
            try {
                const res = await fetch('chapters.json?v=' + Date.now(), { cache: 'no-cache' });
                if (res.ok) {
                    const freshData = await res.json();
                    if (Array.isArray(freshData) && freshData.length > 0) {
                        const hasNew = freshData.length !== allChapters.length;
                        allChapters = freshData;
                        buildToc();
                        if (hasNew) {
                            console.log('[App] New chapters detected! Count:', freshData.length);
                            const btn = document.getElementById('btnRefresh');
                            if (btn) {
                                btn.innerText = '✨ มีตอนใหม่ (' + freshData.length + ')';
                                setTimeout(() => { btn.innerText = '🔄 รีเฟรช'; }, 4000);
                            }
                        }
                    }
                }
            } catch (err) {
                console.log('[App] Background sync skipped (offline or network slow)');
            }
        }

        async function fetchChaptersWithTimeout(timeoutMs = 15000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

            try {
                // 1. Try network fetch with 15s timeout
                const res = await fetch('chapters.json?v=' + Date.now(), { 
                    cache: 'no-cache',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (res.ok) {
                    return await res.json();
                }
            } catch (netErr) {
                clearTimeout(timeoutId);
                console.warn('Network fetch failed or timed out:', netErr);
            }

            // 2. Fallback: Normal fetch without cache busting
            try {
                const fallbackRes = await fetch('chapters.json');
                if (fallbackRes.ok) {
                    return await fallbackRes.json();
                }
            } catch (fbErr) {
                console.warn('Fallback fetch failed:', fbErr);
            }

            // 3. Fallback: Direct CacheStorage read (Offline PWA)
            if ('caches' in window) {
                try {
                    const cached = await caches.match('chapters.json', { ignoreSearch: true })
                                || await caches.match('./chapters.json', { ignoreSearch: true });
                    if (cached) {
                        return await cached.json();
                    }
                } catch (cacheErr) {
                    console.warn('Direct CacheStorage read failed:', cacheErr);
                }
            }

            throw new Error('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์หรือดึงข้อมูลจากแคชได้');
        }

        async function forceRefresh() {
            try {
                const btn = document.getElementById('btnRefresh');
                if (btn) btn.innerText = '⌛ กำลังโหลด...';
                allChapters = await fetchChaptersWithTimeout(15000);
                buildToc();
                loadChapter(currentChapIndex, false);
                if (btn) btn.innerText = '✓ ล่าสุดแล้ว';
                setTimeout(() => { if (btn) btn.innerText = '🔄 รีเฟรช'; }, 2000);
            } catch (err) {
                alert('ไม่สามารถอัพเดทได้ในขณะนี้: ' + err.message);
                const btn = document.getElementById('btnRefresh');
                if (btn) btn.innerText = '🔄 รีเฟรช';
            }
        }

        async function init() {
            // STEP 1: Instant Cache-First Launch (Opens in ~50ms on mobile!)
            let hasLoadedFromCache = false;
            if ('caches' in window) {
                try {
                    const cached = await caches.match('chapters.json', { ignoreSearch: true })
                                || await caches.match('./chapters.json', { ignoreSearch: true });
                    if (cached) {
                        const cachedChapters = await cached.json();
                        if (Array.isArray(cachedChapters) && cachedChapters.length > 0) {
                            console.log('[App] Loaded instantly from cache! Chapters:', cachedChapters.length);
                            allChapters = cachedChapters;
                            buildToc();

                            const savedTheme = localStorage.getItem('novel_theme') || 'sepia';
                            changeTheme(savedTheme);

                            const savedChap = parseInt(localStorage.getItem('novel_last_chapter') || '1', 10);
                            const targetIdx = allChapters.findIndex(c => c.id === savedChap);
                            loadChapter(targetIdx >= 0 ? targetIdx : 0, true);

                            hasLoadedFromCache = true;
                            // Silently check for new chapters in background
                            backgroundSyncChapters();
                            return;
                        }
                    }
                } catch (cacheErr) {
                    console.warn('[App] Cache-first lookup skipped:', cacheErr);
                }
            }

            // STEP 2: First-time open (No cache yet) -> Show friendly spinner & fetch
            if (!hasLoadedFromCache) {
                const reader = document.getElementById('readerArea');
                if (reader) {
                    reader.innerHTML = `
                        <div style="text-align:center;padding:60px 20px;color:var(--text-muted);">
                            <div style="font-size:42px;margin-bottom:12px;animation:spin 2s linear infinite;">⏳</div>
                            <h3 style="margin-bottom:8px;color:var(--text);">กำลังเปิดสมุดบันทึกธุลีเหนือสวรรค์...</h3>
                            <p style="font-size:14px;">กำลังดาวน์โหลดเนื้อหาสำหรับอ่านออฟไลน์ กรุณารอสักครู่</p>
                        </div>
                    `;
                }

                try {
                    allChapters = await fetchChaptersWithTimeout(20000);
                    buildToc();

                    const savedTheme = localStorage.getItem('novel_theme') || 'sepia';
                    changeTheme(savedTheme);

                    const savedChap = parseInt(localStorage.getItem('novel_last_chapter') || '1', 10);
                    const targetIdx = allChapters.findIndex(c => c.id === savedChap);
                    loadChapter(targetIdx >= 0 ? targetIdx : 0, true);
                } catch (err) {
                    console.error('[App] Init failed:', err);
                    if (reader) {
                        reader.innerHTML = `
                            <div style="text-align:center;padding:50px 20px;">
                                <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                                <h3 style="margin-bottom:12px;color:var(--text);">ไม่สามารถโหลดเนื้อหานิยายได้</h3>
                                <p style="font-size:14px;color:var(--text-muted);margin-bottom:24px;">การเชื่อมต่ออินเทอร์เน็ตอาจช้าหรือไม่เสถียร</p>
                                <button onclick="init()" style="padding:10px 24px;border-radius:24px;background:var(--accent);color:#fff;border:none;font-size:16px;cursor:pointer;font-weight:600;">🔄 กดเพื่อลองใหม่อีกครั้ง</button>
                            </div>
                        `;
                    }
                }
            }
        }

        function changeTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('novel_theme', theme);
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));
            if (theme === 'sepia') document.getElementById('btn-sepia')?.classList.add('active');
            if (theme === 'warm-dark') document.getElementById('btn-dark')?.classList.add('active');
            if (theme === 'light') document.getElementById('btn-light')?.classList.add('active');
        }

        const VOLUMES = [
            {
                id: 1,
                tag: 'เล่มที่ ๑ · ภาค ๑',
                title: 'ตะกอนใต้เงาศิลาคราม',
                sub: 'ตอนที่ 1–25',
                cover: 'Cover_Vol1.png',
                start: 1,
                end: 25
            },
            {
                id: 2,
                tag: 'เล่มที่ ๒ · ภาค ๒',
                title: 'รอยเลือดริมแม่น้ำหมอก',
                sub: 'ตอนที่ 26–50',
                cover: 'Cover_Vol2.png',
                start: 26,
                end: 50
            },
            {
                id: 3,
                tag: 'เล่มที่ ๓ · ภาค ๓',
                title: 'แดนรกร้างและแนวกำแพงเหล็ก',
                sub: 'ตอนที่ 51–75',
                cover: 'Cover_Vol3.png',
                start: 51,
                end: 75
            },
            {
                id: 4,
                tag: 'เล่มที่ ๔ · ภาค ๔',
                title: 'เก้าแคว้นและเงาสะท้อนเมืองหลวง',
                sub: 'ตอนที่ 76–100',
                cover: '',
                icon: '🦅',
                start: 76,
                end: 100
            }
        ];

        function getEffectiveVolumes() {
            let vols = [...VOLUMES];
            const maxEnd = Math.max(...VOLUMES.map(v => v.end), 0);
            const extraChapters = allChapters.filter(c => c.id > maxEnd);
            if (extraChapters.length > 0) {
                let currentStart = maxEnd + 1;
                const highestId = Math.max(...extraChapters.map(c => c.id));
                while (currentStart <= highestId) {
                    const currentEnd = currentStart + 24;
                    const vNum = Math.floor((currentStart - 1) / 25) + 1;
                    vols.push({
                        id: vNum,
                        tag: `เล่มที่ ${vNum} · ภาค ${vNum}`,
                        title: 'ภาคใหม่ (กำลังเผยแพร่)',
                        sub: `ตอนที่ ${currentStart}–${currentEnd}`,
                        cover: '',
                        icon: '📜',
                        start: currentStart,
                        end: currentEnd
                    });
                    currentStart = currentEnd + 1;
                }
            }
            return vols;
        }

        let collapsedVolumes = {};

        function toggleVolume(volId) {
            collapsedVolumes[volId] = !collapsedVolumes[volId];
            const card = document.getElementById(`vol-card-${volId}`);
            if (card) {
                if (collapsedVolumes[volId]) {
                    card.classList.add('collapsed');
                } else {
                    card.classList.remove('collapsed');
                }
            }
        }

        function buildToc() {
            const container = document.getElementById('tocContainer');
            if (!container) return;

            const effectiveVolumes = getEffectiveVolumes();
            const currentChap = allChapters[currentChapIndex];
            const currentChapId = currentChap ? currentChap.id : 1;
            const activeVolId = effectiveVolumes.find(v => currentChapId >= v.start && currentChapId <= v.end)?.id || 1;

            container.innerHTML = effectiveVolumes.map(vol => {
                const volChapters = allChapters.filter(c => c.id >= vol.start && c.id <= vol.end);
                if (volChapters.length === 0) return '';

                if (collapsedVolumes[vol.id] === undefined) {
                    collapsedVolumes[vol.id] = (vol.id !== activeVolId);
                }
                const isCollapsed = collapsedVolumes[vol.id];

                let coverHtml = '';
                if (vol.cover) {
                    coverHtml = `
                        <div class="toc-hero-cover-wrap" onclick="event.stopPropagation(); showCoverLightbox(${vol.id});" title="คลิกเพื่อดูหน้าปกขนาดเต็ม">
                            <img src="${vol.cover}" alt="หน้าปก ${vol.title}" class="toc-hero-cover">
                            <span class="zoom-badge">🔍 ขยาย</span>
                        </div>
                    `;
                } else {
                    coverHtml = `
                        <div class="toc-hero-cover-wrap" style="font-size:28px;">
                            ${vol.icon || '📜'}
                        </div>
                    `;
                }

                const chaptersListHtml = volChapters.map(chap => {
                    const idx = allChapters.findIndex(c => c.id === chap.id);
                    const isActive = idx === currentChapIndex ? 'active' : '';
                    return `
                        <li class="toc-item ${isActive}" onclick="selectChapter(${idx})">
                            <span>${chap.title}</span>
                            ${isActive ? '<span style="font-size:12px;color:var(--accent);">📖 กำลังอ่าน</span>' : ''}
                        </li>
                    `;
                }).join('');

                return `
                    <div class="toc-volume-card ${isCollapsed ? 'collapsed' : ''}" id="vol-card-${vol.id}">
                        <div class="toc-hero-banner" onclick="toggleVolume(${vol.id})" title="คลิกเพื่อย่อ/ขยายเล่ม">
                            ${coverHtml}
                            <div class="toc-hero-details">
                                <div class="toc-hero-tag">${vol.tag}</div>
                                <div class="toc-hero-title">${vol.title}</div>
                                <p class="toc-hero-sub">${vol.sub} · (${volChapters.length} ตอน)</p>
                            </div>
                            <div class="toc-vol-toggle" title="ย่อ/ขยายเล่ม">▼</div>
                        </div>
                        <ul class="toc-list">
                            ${chaptersListHtml}
                        </ul>
                    </div>
                `;
            }).join('');
        }

        function selectChapter(idx) {
            closeToc();
            loadChapter(idx, false);
        }

        function loadChapter(idx, shouldRestoreScroll) {
            currentChapIndex = idx;
            const chap = allChapters[idx];
            localStorage.setItem('novel_last_chapter', chap.id);

            let htmlStr = '';

            // If Chapter 1, display the elegant Hero Volume 1 Cover Card
            if (idx === 0) {
                htmlStr += `
                    <div class="vol-cover-card">
                        <div class="vol-cover-img-wrapper" onclick="showCoverLightbox()" title="คลิกเพื่อดูหน้าปกขนาดเต็ม">
                            <img src="Cover_Vol1.png" alt="หน้าปก ธุลีเหนือสวรรค์ เล่มที่ 1" class="vol-cover-img">
                        </div>
                        <div class="vol-cover-info">
                            <span class="vol-cover-badge">เล่มที่ ๑ · ภาค : ตะกอนใต้เงาศิลาคราม</span>
                            <div class="vol-cover-title">ธุลีเหนือสวรรค์ (《尘上天》)</div>
                            <p class="vol-cover-desc">ผู้เขียน: หวงตี้ปิ้ง (KaPonGZaYo) · ตอนที่ 1–25</p>
                        </div>
                    </div>
                `;
            }

            // Display Volume 2 at its opening chapter.
            if (chap.id === 26) {
                htmlStr += `
                    <div class="vol-cover-card">
                        <div class="vol-cover-img-wrapper" onclick="showCoverLightbox(2)" title="คลิกเพื่อดูหน้าปกขนาดเต็ม">
                            <img src="Cover_Vol2.png" alt="หน้าปก ธุลีเหนือสวรรค์ เล่มที่ 2" class="vol-cover-img">
                        </div>
                        <div class="vol-cover-info">
                            <span class="vol-cover-badge">เล่มที่ ๒ · ภาค : รอยเลือดริมแม่น้ำหมอก</span>
                            <div class="vol-cover-title">ธุลีเหนือสวรรค์ (《尘上天》)</div>
                            <p class="vol-cover-desc">ผู้เขียน: หวงตี้ปิ้ง (KaPonGZaYo) · ตอนที่ 26–50</p>
                        </div>
                    </div>
                `;
            }

            // Display Volume 3 at its opening chapter.
            if (chap.id === 51) {
                htmlStr += `
                    <div class="vol-cover-card">
                        <div class="vol-cover-img-wrapper" onclick="showCoverLightbox(3)" title="คลิกเพื่อดูหน้าปกขนาดเต็ม">
                            <img src="Cover_Vol3.png" alt="หน้าปก ธุลีเหนือสวรรค์ เล่มที่ 3" class="vol-cover-img">
                        </div>
                        <div class="vol-cover-info">
                            <span class="vol-cover-badge">เล่มที่ ๓ · ภาค : แดนรกร้างและแนวกำแพงเหล็ก</span>
                            <div class="vol-cover-title">ธุลีเหนือสวรรค์ (《尘上天》)</div>
                            <p class="vol-cover-desc">ผู้เขียน: หวงตี้ปิ้ง (KaPonGZaYo) · ตอนที่ 51–75</p>
                        </div>
                    </div>
                `;
            }

            // Display Volume 4 at its opening chapter.
            if (chap.id === 76) {
                htmlStr += `
                    <div class="vol-cover-card">
                        <div class="vol-cover-info" style="width: 100%;">
                            <span class="vol-cover-badge">เล่มที่ ๔ · ภาค : เก้าแคว้นและเงาสะท้อนเมืองหลวง</span>
                            <div class="vol-cover-title">ธุลีเหนือสวรรค์ (《尘上天》)</div>
                            <p class="vol-cover-desc">ผู้เขียน: หวงตี้ปิ้ง (KaPonGZaYo) · ตอนที่ 76–100</p>
                        </div>
                    </div>
                `;
            }

            htmlStr += `<h1 class="chapter-title">${chap.title}</h1>`;
            chap.paragraphs.forEach(p => {
                if (p.type === 'divider') htmlStr += `<div class="divider">❖ ❖ ❖</div>`;
                else if (p.type === 'quote') htmlStr += `<div class="quote-box">${p.text}</div>`;
                else htmlStr += `<p>${p.text}</p>`;
            });

            // Nav Footer
            const prevDisabled = idx === 0 ? 'disabled' : '';
            const nextDisabled = idx === allChapters.length - 1 ? 'disabled' : '';

            htmlStr += `
                <div class="nav-footer">
                    <button class="nav-link" ${prevDisabled} onclick="loadChapter(${idx - 1}, false)">← ตอนก่อนหน้า</button>
                    <button class="nav-link next" ${nextDisabled} onclick="loadChapter(${idx + 1}, false)">ตอนถัดไป →</button>
                </div>
            `;

            document.getElementById('readerArea').innerHTML = htmlStr;
            buildToc();

            // Handle Scroll Restoration
            if (shouldRestoreScroll) {
                const savedY = parseFloat(localStorage.getItem(`novel_scroll_ch_${chap.id}`) || '0');
                if (savedY > 0) {
                    setTimeout(() => {
                        window.scrollTo({ top: savedY, behavior: 'instant' });
                    }, 50);
                } else {
                    window.scrollTo(0, 0);
                }
            } else {
                window.scrollTo(0, 0);
                localStorage.setItem(`novel_scroll_ch_${chap.id}`, '0');
            }
        }

        // Save scroll position on the fly
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPos = window.scrollY;
            const progress = docHeight > 0 ? (scrollPos / docHeight) * 100 : 0;
            document.getElementById('progressBar').style.width = progress + '%';

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                if (allChapters[currentChapIndex]) {
                    const chapId = allChapters[currentChapIndex].id;
                    localStorage.setItem(`novel_scroll_ch_${chapId}`, scrollPos);
                }
            }, 150);
        });

        function openToc() {
            const effectiveVolumes = getEffectiveVolumes();
            const currentChap = allChapters[currentChapIndex];
            if (currentChap) {
                const activeVol = effectiveVolumes.find(v => currentChap.id >= v.start && currentChap.id <= v.end);
                if (activeVol) {
                    collapsedVolumes[activeVol.id] = false;
                }
            }
            buildToc();
            document.getElementById('tocModal').classList.add('open');
            setTimeout(() => {
                const activeItem = document.querySelector('.toc-item.active');
                if (activeItem) {
                    activeItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
            }, 100);
        }

        function closeToc(e) {
            document.getElementById('tocModal').classList.remove('open');
        }

        function showCoverLightbox(volume = 1) {
            const effectiveVolumes = getEffectiveVolumes();
            const vol = effectiveVolumes.find(v => v.id === volume);
            if (vol && vol.cover) {
                const image = document.querySelector('#coverLightbox .lightbox-img');
                image.src = vol.cover;
                image.alt = 'หน้าปก เล่มที่ ' + volume + ' ขนาดเต็ม';
                document.getElementById('coverLightbox').classList.add('open');
            }
        }

        function closeCoverLightbox() {
            document.getElementById('coverLightbox').classList.remove('open');
        }

        init();
    </script>
</body>
</html>
