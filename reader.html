<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <title>ธุลีเหนือสวรรค์ (Dust Above the Heavens) - E-Reader</title>

    <!-- PWA Settings for Mobile App Installation -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#9a7432">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ธุลีเหนือสวรรค์">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&family=Charm:wght@700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,400;0,600;0,700;1,400&family=Charm:wght@700&display=swap"></noscript>
    <script>
        // Start fetching the target chapter immediately in <head> before CSS/body finishes parsing
        (function() {
            try {
                var urlCh = parseInt(new URLSearchParams(window.location.search).get('ch') || '0', 10);
                var savedCh = urlCh > 0 ? urlCh : parseInt(localStorage.getItem('novel_last_chapter') || '1', 10);
                var targetCh = (savedCh > 0 && isFinite(savedCh)) ? savedCh : 1;
                var url = 'chapters/ch_' + String(targetCh).padStart(3, '0') + '.json';
                window.__EARLY_CHAP_ID__ = targetCh;
                window.__EARLY_CHAP_PROMISE__ = fetch(url).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            --bg: #f8f5ec;
            --text: #2d2925;
            --text-muted: #786f64;
            --title: #181410;
            --card-bg: #ede6d6;
            --card-border: #d8ceba;
            --accent: #9a7432;
            --accent-glow: rgba(154, 116, 50, 0.25);
            --quote-bg: #ece5d3;
            --quote-border: #b89758;
            --header-bg: rgba(248, 245, 236, 0.95);
            --header-border: #e2d7c3;
        }

        [data-theme="warm-dark"] {
            --bg: #191816;
            --text: #c8c2b7;
            --text-muted: #8f877b;
            --title: #ede6d8;
            --card-bg: #262421;
            --card-border: #3b3731;
            --accent: #cfa85e;
            --accent-glow: rgba(207, 168, 94, 0.25);
            --quote-bg: #22201d;
            --quote-border: #917540;
            --header-bg: rgba(25, 24, 22, 0.95);
            --header-border: #332f29;
        }

        [data-theme="light"] {
            --bg: #ffffff;
            --text: #222222;
            --text-muted: #666666;
            --title: #0a0a0a;
            --card-bg: #f2f2f2;
            --card-border: #e0e0e0;
            --accent: #555555;
            --accent-glow: rgba(85, 85, 85, 0.2);
            --quote-bg: #f6f6f6;
            --quote-border: #999999;
            --header-bg: rgba(255, 255, 255, 0.95);
            --header-border: #eaeaea;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.95;
            font-size: 21px;
            -webkit-font-smoothing: antialiased;
        }

        header {
            position: sticky;
            top: 0;
            background-color: var(--header-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--header-border);
            padding: max(10px, env(safe-area-inset-top)) 14px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            line-height: 1.2;
        }

        @media (max-width: 600px) {
            body {
                font-size: 19px;
            }
            header {
                padding: max(8px, env(safe-area-inset-top)) 10px 8px;
            }
            .btn {
                padding: 6px 8px;
                font-size: 13px;
            }
            .hide-sm {
                display: none;
            }
            .container {
                padding: 18px 16px 80px 16px;
            }
        }

        .btn.active {
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        .btn-install {
            background-color: var(--accent);
            color: #fff;
            border-color: var(--accent);
            border-radius: 20px;
            font-size: 12px;
            padding: 5px 10px;
            display: none;
            cursor: pointer;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 20px 80px 20px;
        }

        /* Cover Hero Section (At Chapter 1 header) */
        .vol-cover-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            margin: 0 0 32px 0;
            text-align: center;
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .vol-cover-img-wrapper {
            display: inline-block;
            position: relative;
            cursor: pointer;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .vol-cover-img-wrapper:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 34px rgba(0,0,0,0.45);
        }

        .vol-cover-img {
            display: block;
            max-width: 260px;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        .vol-cover-info {
            margin-top: 14px;
        }

        .vol-cover-badge {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            background: var(--bg);
            border: 1px solid var(--card-border);
            padding: 3px 12px;
            border-radius: 20px;
            margin-bottom: 6px;
        }

        .vol-cover-title {
            font-family: 'Charm', cursive, 'Sarabun', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--title);
            margin: 4px 0 6px 0;
            line-height: 1.3;
        }

        .vol-cover-desc {
            font-size: 14px;
            color: var(--text);
            opacity: 0.85;
            margin: 0;
            line-height: 1.6;
        }

        h1.chapter-title {
            font-size: 27px;
            color: var(--title);
            text-align: center;
            margin: 16px 0 28px 0;
            line-height: 1.4;
            font-weight: 700;
        }

        p {
            margin-bottom: 22px;
            text-indent: 1.8em;
            text-align: justify;
        }

        .divider {
            text-align: center;
            color: var(--accent);
            margin: 36px 0;
            letter-spacing: 8px;
            font-size: 18px;
            opacity: 0.8;
        }

        .quote-box {
            background-color: var(--quote-bg);
            border-left: 4px solid var(--quote-border);
            padding: 14px 18px;
            margin: 24px 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            margin: 0 0 22px 0;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--header-border);
            gap: 12px;
        }

        .nav-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            padding-top: 24px;
            border-top: 1px solid var(--header-border);
            gap: 12px;
        }

        .nav-link {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }

        .nav-link.next {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .nav-link:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Modal TOC */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 2000;
            justify-content: center;
            align-items: flex-end;
        }

        @media (min-width: 600px) {
            .modal {
                align-items: center;
            }
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg);
            width: 100%;
            max-width: 520px;
            max-height: 85vh;
            border-radius: 16px 16px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
        }

        @media (min-width: 600px) {
            .modal-content {
                border-radius: 16px;
                max-height: 80vh;
            }
        }

        .modal-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--header-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            color: var(--title);
            background: var(--header-bg);
        }

        /* TOC Volume Sections & Collapsible Accordion */
        .toc-body {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .toc-volume-card {
            flex-shrink: 0;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .toc-volume-card:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }

        .toc-hero-banner {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 14px;
            background: var(--card-bg);
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background 0.2s ease;
        }

        .toc-hero-banner:hover {
            background: var(--quote-bg);
        }

        .toc-hero-cover-wrap {
            position: relative;
            width: 54px;
            height: 78px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            cursor: zoom-in;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toc-hero-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .toc-hero-cover-wrap .zoom-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 9px;
            text-align: center;
            padding: 1px 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .toc-hero-details {
            flex: 1;
            min-width: 0;
        }

        .toc-hero-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toc-hero-title {
            font-family: 'Charm', cursive, 'Sarabun', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--title);
            margin: 2px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toc-hero-sub {
            font-size: 12px;
            color: var(--text);
            opacity: 0.85;
            margin: 0;
        }

        .toc-vol-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg);
            border: 1px solid var(--card-border);
            color: var(--accent);
            font-size: 12px;
            flex-shrink: 0;
            transition: transform 0.25s ease, background 0.2s ease;
        }

        .toc-volume-card.collapsed .toc-vol-toggle {
            transform: rotate(-90deg);
        }

        .toc-volume-card.collapsed .toc-list {
            display: none;
        }

        .toc-list {
            list-style: none;
            padding: 8px 12px 10px 12px;
            margin: 0;
            border-top: 1px dashed var(--card-border);
            background: var(--bg);
        }

        .toc-item {
            padding: 11px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 3px;
            font-size: 15px;
            font-weight: 500;
            border-bottom: 1px solid var(--card-border);
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toc-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .toc-item:hover, .toc-item.active {
            background: var(--card-bg);
            color: var(--accent);
            font-weight: 700;
            padding-left: 18px;
        }

        .reading-progress-bar {
            position: fixed;
            top: 0; left: 0;
            height: 3px;
            background: var(--accent);
            width: 0%;
            z-index: 9999;
            transition: width 0.1s linear;
        }

        .chapter-meta-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: -18px 0 22px 0;
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .chapter-meta-pill {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .toc-char-badge {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            white-space: nowrap;
        }

        .copy-tools-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: -8px 0 26px 0;
        }

        .copy-tool-btn {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13.5px;
            font-family: 'Sarabun', sans-serif;
            cursor: pointer;
            transition: all 0.18s ease;
        }

        .copy-tool-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .copy-tool-btn.copied {
            border-color: #2e8b57;
            color: #2e8b57;
            font-weight: 600;
        }

        /* Fullscreen Image Preview Lightbox */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(8px);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            cursor: zoom-out;
        }

        .lightbox-modal.open {
            display: flex;
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 12px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.7);
            object-fit: contain;
            animation: zoomIn 0.25s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .toc-search-wrap {
            padding: 10px 14px 8px;
            border-bottom: 1px solid var(--header-border);
            background: var(--bg);
        }

        .toc-search-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .toc-search-input:focus {
            border-color: var(--accent);
        }

        /* Copy protection for non-admin visitors */
        body.no-copy {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body:not(.is-admin) .copy-tools-bar {
            display: none !important;
        }
        .locked-chapter-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 36px 24px;
            text-align: center;
            margin: 36px auto;
            max-width: 540px;
        }
        .locked-chapter-icon {
            font-size: 46px;
            margin-bottom: 12px;
        }
        .locked-chapter-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--title);
            margin-bottom: 10px;
        }
        .locked-chapter-desc {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 22px;
        }
        .admin-login-btn-primary {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 11px 22px;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }
        .admin-auth-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .admin-auth-modal.open {
            display: flex;
        }
        .admin-auth-card {
            background: var(--bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.45);
        }
        .admin-auth-card h3 {
            margin: 0 0 6px;
            color: var(--title);
            font-size: 20px;
        }
        .admin-auth-card p {
            margin: 0 0 16px;
            color: var(--text-muted);
            font-size: 13px;
            line-height: 1.5;
        }
        .admin-auth-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }
        .admin-auth-input:focus {
            border-color: var(--accent);
        }
        .admin-auth-err {
            color: #dc2626;
            font-size: 13px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="reading-progress-bar" id="progressBar"></div>

    <header>
        <div class="header-left">
            <a href="index.html" class="btn" style="text-decoration:none;" title="กลับหน้าแนะนำนิยาย">🏠<span class="hide-sm"> หน้าหลัก</span></a>
            <button class="btn brand" onclick="openToc()">📖 สารบัญ</button>
            <button class="btn" id="btnReaderAuth" onclick="handleReaderAuthBtn()" title="เข้าสู่ระบบผู้แต่ง (Admin)">🔐<span class="hide-sm"> ผู้แต่ง</span></button>
        </div>
        <div class="controls">
            <button class="btn-install" id="btnInstall" onclick="installPWA()" title="ติดตั้งแอป">📲</button>
            <button class="btn" onclick="adjustFont(-1)" title="ลดขนาดตัวอักษร">ก-</button>
            <button class="btn" onclick="adjustFont(1)" title="เพิ่มขนาดตัวอักษร">ก+</button>
            <button class="btn" id="btn-sepia" onclick="changeTheme('sepia')" title="โทนซีเปีย">📜<span class="hide-sm"> ซีเปีย</span></button>
            <button class="btn" id="btn-dark" onclick="changeTheme('warm-dark')" title="โทนมืดอุ่น">🌙<span class="hide-sm"> มืดอุ่น</span></button>
            <button class="btn" id="btn-light" onclick="changeTheme('light')" title="โทนสว่าง">☀️<span class="hide-sm"> สว่าง</span></button>
        </div>
    </header>

    <div class="container" id="readerArea">
        <!-- Chapter loaded dynamically -->
    </div>

    <!-- TOC Modal -->
    <div class="modal" id="tocModal" onclick="closeToc(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">

    <script>
        const STATIC_AUTH_HASH = "3261688dda463c8c6b049018a758b18a741c1fc5efff3346065bbe7a1400544e";
        const CRYPTO_SALT = "dust-above-heavens-v1";
        const CRYPTO_ITERATIONS = 100000;
        let cachedCryptoKey = null;

        function isAdminLoggedIn() {
            return Boolean(localStorage.getItem('novel_admin_crypto_key'));
        }

        function applyAdminAndCopyProtection() {
            const isAdmin = isAdminLoggedIn();
            if (isAdmin) {
                document.body.classList.add('is-admin');
                document.body.classList.remove('no-copy');
            } else {
                document.body.classList.remove('is-admin');
                document.body.classList.add('no-copy');
            }
            const btn = document.getElementById('btnReaderAuth');
            if (btn) {
                btn.innerHTML = isAdmin
                    ? '🔓<span class="hide-sm"> ผู้แต่ง (Admin)</span>'
                    : '🔐<span class="hide-sm"> ผู้แต่ง</span>';
                btn.title = isAdmin ? 'ล็อกอินผู้แต่งแล้ว (คลิกเพื่อออกจากระบบ)' : 'เข้าสู่ระบบผู้แต่ง (Admin)';
            }
        }

        async function sha256Hex(str) {
            const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function deriveAdminKeyBase64(username, password) {
            const enc = new TextEncoder();
            const baseKey = await window.crypto.subtle.importKey(
                'raw',
                enc.encode(`${username}:${password}`),
                'PBKDF2',
                false,
                ['deriveBits']
            );
            const bits = await window.crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    salt: enc.encode(CRYPTO_SALT),
                    iterations: CRYPTO_ITERATIONS,
                    hash: 'SHA-256'
                },
                baseKey,
                256
            );
            const bytes = new Uint8Array(bits);
            let bin = '';
            for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
            return btoa(bin);
        }

        async function getAesCryptoKey() {
            if (cachedCryptoKey) return cachedCryptoKey;
            const b64 = localStorage.getItem('novel_admin_crypto_key');
            if (!b64) return null;
            const bin = atob(b64);
            const raw = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) raw[i] = bin.charCodeAt(i);
            cachedCryptoKey = await window.crypto.subtle.importKey(
                'raw',
                raw,
                { name: 'AES-GCM' },
                false,
                ['decrypt']
            );
            return cachedCryptoKey;
        }

        async function decryptChapterIfNeeded(chap) {
            if (!chap) return null;
            if (!chap.locked || !chap.encrypted) return chap;
            if (!isAdminLoggedIn()) return null;
            if (chap._decryptedTitle && Array.isArray(chap._decryptedParagraphs)) {
                return {
                    ...chap,
                    title: chap._decryptedTitle,
                    paragraphs: chap._decryptedParagraphs,
                    decrypted: true
                };
            }
            try {
                const key = await getAesCryptoKey();
                if (!key) return null;
                const ivBin = atob(chap.encrypted.iv);
                const iv = new Uint8Array(ivBin.length);
                for (let i = 0; i < ivBin.length; i++) iv[i] = ivBin.charCodeAt(i);

                const dataBin = atob(chap.encrypted.data);
                const data = new Uint8Array(dataBin.length);
                for (let i = 0; i < dataBin.length; i++) data[i] = dataBin.charCodeAt(i);

                const plainBuf = await window.crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv },
                    key,
                    data
                );
                const plainText = new TextDecoder().decode(plainBuf);
                const parsed = JSON.parse(plainText);
                chap._decryptedTitle = parsed.title || chap.title;
                chap._decryptedParagraphs = parsed.paragraphs || [];
                return {
                    ...chap,
                    title: chap._decryptedTitle,
                    paragraphs: chap._decryptedParagraphs,
                    decrypted: true
                };
            } catch (err) {
                console.warn('[Reader] Chapter decrypt failed:', err);
                return null;
            }
        }

        async function decryptAdminTitlesBlob(encObj) {
            if (!encObj || !encObj.iv || !encObj.data || !isAdminLoggedIn()) return null;
            try {
                const key = await getAesCryptoKey();
                if (!key) return null;
                const ivBin = atob(encObj.iv);
                const iv = new Uint8Array(ivBin.length);
                for (let i = 0; i < ivBin.length; i++) iv[i] = ivBin.charCodeAt(i);

                const dataBin = atob(encObj.data);
                const data = new Uint8Array(dataBin.length);
                for (let i = 0; i < dataBin.length; i++) data[i] = dataBin.charCodeAt(i);

                const plainBuf = await window.crypto.subtle.decrypt(
                    { name: 'AES-GCM', iv },
                    key,
                    data
                );
                return JSON.parse(new TextDecoder().decode(plainBuf));
            } catch (err) {
                console.warn('[Reader] Admin titles decrypt failed:', err);
                return null;
            }
        }

        async function decryptAllChaptersForAdmin(forceNetwork = false) {
            if (!isAdminLoggedIn() || !Array.isArray(allChapters) || allChapters.length === 0) return;

            const needsTitle = allChapters.some(c => c && c.locked && !c._decryptedTitle);
            if (!needsTitle && !forceNetwork) {
                buildToc();
                return;
            }

            let titlesMap = null;
            if (!forceNetwork && typeof EMBEDDED_ADMIN_TITLES === 'object' && EMBEDDED_ADMIN_TITLES) {
                titlesMap = await decryptAdminTitlesBlob(EMBEDDED_ADMIN_TITLES);
            }

            const stillMissing = !titlesMap || allChapters.some(c => c && c.locked && !c._decryptedTitle && !titlesMap[String(c.id)]);
            if (forceNetwork || stillMissing) {
                try {
                    const freshEnc = await fetchJsonWithTimeout('admin_titles.json?v=' + Date.now(), 8000, true);
                    const freshMap = await decryptAdminTitlesBlob(freshEnc);
                    if (freshMap) titlesMap = Object.assign({}, titlesMap || {}, freshMap);
                } catch (e) {
                    if ('caches' in window) {
                        try {
                            const cached = await caches.match('admin_titles.json', { ignoreSearch: true })
                                        || await caches.match('./admin_titles.json', { ignoreSearch: true });
                            if (cached) {
                                const cachedMap = await decryptAdminTitlesBlob(await cached.json());
                                if (cachedMap) titlesMap = Object.assign({}, titlesMap || {}, cachedMap);
                            }
                        } catch (ce) {}
                    }
                }
            }

            if (!titlesMap && typeof EMBEDDED_ADMIN_TITLES === 'object' && EMBEDDED_ADMIN_TITLES) {
                titlesMap = await decryptAdminTitlesBlob(EMBEDDED_ADMIN_TITLES);
            }
            if (titlesMap) {
                allChapters.forEach(c => {
                    if (c && c.locked && titlesMap[String(c.id)]) {
                        c._decryptedTitle = titlesMap[String(c.id)];
                    }
                });
            }

            // Also decrypt any locked chapter whose encrypted body is already loaded in memory
            const loadedLocked = allChapters.filter(c => c && c.locked && c.encrypted && !c._decryptedTitle);
            if (loadedLocked.length > 0) {
                await Promise.all(loadedLocked.map(c => decryptChapterIfNeeded(c)));
            }
            buildToc();
        }

        function handleReaderAuthBtn() {
            if (isAdminLoggedIn()) {
                if (confirm('คุณเข้าสู่ระบบผู้แต่ง (Admin) ค้างไว้อยู่แล้ว ต้องการออกจากระบบหรือไม่?')) {
                    localStorage.removeItem('novel_admin_crypto_key');
                    localStorage.removeItem('novel_admin_token');
                    sessionStorage.removeItem('novel_admin_token');
                    cachedCryptoKey = null;
                    if (Array.isArray(allChapters)) {
                        allChapters.forEach(c => {
                            delete c._decryptedTitle;
                            delete c._decryptedParagraphs;
                        });
                    }
                    applyAdminAndCopyProtection();
                    buildToc();
                    loadChapter(currentChapIndex, false);
                }
            } else {
                openAdminAuthModal();
            }
        }

        function openAdminAuthModal() {
            const errEl = document.getElementById('readerAuthErr');
            if (errEl) errEl.style.display = 'none';
            document.getElementById('adminAuthModal')?.classList.add('open');
            setTimeout(() => document.getElementById('readerAuthUser')?.focus(), 50);
        }

        function closeAdminAuthModal() {
            document.getElementById('adminAuthModal')?.classList.remove('open');
        }

        async function submitAdminAuth(e) {
            e.preventDefault();
            const username = document.getElementById('readerAuthUser').value.trim();
            const password = document.getElementById('readerAuthPass').value.trim();
            const errEl = document.getElementById('readerAuthErr');
            const submitBtn = document.getElementById('readerAuthSubmit');
            if (errEl) errEl.style.display = 'none';
            if (submitBtn) submitBtn.disabled = true;
            try {
                const digest = await sha256Hex(`${username}:${password}`);
                if (digest !== STATIC_AUTH_HASH) {
                    if (errEl) {
                        errEl.innerText = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง (เฉพาะผู้แต่งเท่านั้น)';
                        errEl.style.display = 'block';
                    }
                    return;
                }
                const keyB64 = await deriveAdminKeyBase64(username, password);
                localStorage.setItem('novel_admin_crypto_key', keyB64);
                localStorage.setItem('novel_admin_token', 'static-token-' + Date.now());
                cachedCryptoKey = null;
                closeAdminAuthModal();
                applyAdminAndCopyProtection();
                await decryptAllChaptersForAdmin(false);
                await loadChapter(currentChapIndex, false);
            } finally {
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        // Copy & selection protection for non-admin visitors
        ['contextmenu', 'copy', 'cut', 'selectstart', 'dragstart'].forEach(evtName => {
            document.addEventListener(evtName, (e) => {
                if (isAdminLoggedIn()) return;
                if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
                e.preventDefault();
            });
        });
        document.addEventListener('keydown', (e) => {
            if (isAdminLoggedIn()) return;
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            const key = (e.key || '').toLowerCase();
            if ((e.ctrlKey || e.metaKey) && ['c', 'x', 'a', 'u', 's'].includes(key)) {
                e.preventDefault();
            } else if (e.key === 'F12') {
                e.preventDefault();
            }
        });
        applyAdminAndCopyProtection();
        let allChapters = [];
        let currentChapIndex = 0;
        let deferredPrompt;

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('SW Registered');
                        reg.update();
                    })
                    .catch(err => console.log('SW Error:', err));
            });
        }

        // PWA Install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('btnInstall');
            if (btn) btn.style.display = 'inline-block';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('btnInstall').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }

        function getChapterFileUrl(chapId) {
            return 'chapters/ch_' + String(chapId).padStart(3, '0') + '.json';
        }

        async function fetchJsonWithTimeout(url, timeoutMs = 10000, noCache = true) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, {
                    cache: noCache ? 'no-cache' : 'default',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (res.ok) return await res.json();
            } catch (err) {
                clearTimeout(timeoutId);
                throw err;
            }
            throw new Error('HTTP error fetching ' + url);
        }

        async function ensureChapterLoaded(rawChap, forceNetwork = false) {
            if (!rawChap) return null;
            if (!forceNetwork && (Array.isArray(rawChap.paragraphs) || (rawChap.locked && rawChap.encrypted))) {
                return rawChap;
            }
            const fileUrl = getChapterFileUrl(rawChap.id);

            // 1. Reuse early <head> in-flight fetch if matching
            if (!forceNetwork && window.__EARLY_CHAP_PROMISE__ && window.__EARLY_CHAP_ID__ === rawChap.id) {
                const earlyPromise = window.__EARLY_CHAP_PROMISE__;
                window.__EARLY_CHAP_PROMISE__ = null;
                try {
                    const earlyData = await earlyPromise;
                    if (earlyData && earlyData.id === rawChap.id) {
                        Object.assign(rawChap, earlyData);
                        return rawChap;
                    }
                } catch (e) {}
            }

            if (!forceNetwork && 'caches' in window) {
                try {
                    const cached = await caches.match(fileUrl, { ignoreSearch: true })
                                || await caches.match('./' + fileUrl, { ignoreSearch: true });
                    if (cached) {
                        const data = await cached.json();
                        Object.assign(rawChap, data);
                        return rawChap;
                    }
                } catch (e) {}
            }

            try {
                const url = forceNetwork ? (fileUrl + '?v=' + Date.now()) : fileUrl;
                const data = await fetchJsonWithTimeout(url, 12000, forceNetwork);
                if (data && data.id === rawChap.id) {
                    if (forceNetwork) {
                        delete rawChap._decryptedTitle;
                        delete rawChap._decryptedParagraphs;
                    }
                    Object.assign(rawChap, data);
                    return rawChap;
                }
            } catch (netErr) {
                console.warn('[Reader] Failed loading chapter file:', fileUrl, netErr);
            }

            if ('caches' in window) {
                try {
                    const cached = await caches.match(fileUrl, { ignoreSearch: true })
                                || await caches.match('./' + fileUrl, { ignoreSearch: true });
                    if (cached) {
                        const data = await cached.json();
                        Object.assign(rawChap, data);
                        return rawChap;
                    }
                } catch (e) {}
            }
            throw new Error('ไม่สามารถโหลดเนื้อหาตอนที่ ' + rawChap.id + ' ได้');
        }

        function prefetchChapterByIndex(idx) {
            if (!Array.isArray(allChapters) || idx < 0 || idx >= allChapters.length) return;
            const target = allChapters[idx];
            if (!target || Array.isArray(target.paragraphs) || (target.locked && target.encrypted)) return;
            ensureChapterLoaded(target, false).catch(() => {});
        }

        // Background update check (Stale-While-Revalidate pattern)
        async function backgroundSyncChapters() {
            try {
                const freshMeta = await fetchJsonWithTimeout('chapters_meta.json?v=' + Date.now(), 10000, true);
                if (Array.isArray(freshMeta) && freshMeta.length > 0) {
                    const prevById = new Map(allChapters.map(c => [c.id, c]));
                    const prevCurrent = allChapters[currentChapIndex];
                    const hasNew = freshMeta.length !== allChapters.length;
                    const nextCurrentMeta = prevCurrent ? freshMeta.find(c => c.id === prevCurrent.id) : null;
                    const hasCurrentChanged = Boolean(
                        prevCurrent && nextCurrentMeta && (
                            prevCurrent.charCount !== nextCurrentMeta.charCount ||
                            prevCurrent.title !== nextCurrentMeta.title ||
                            Boolean(prevCurrent.locked) !== Boolean(nextCurrentMeta.locked)
                        )
                    );

                    allChapters = freshMeta.map(m => {
                        const old = prevById.get(m.id);
                        if (old) {
                            const merged = Object.assign({}, old, m);
                            if (hasCurrentChanged && old.id === prevCurrent.id) {
                                delete merged.paragraphs;
                                delete merged.encrypted;
                                delete merged._decryptedTitle;
                                delete merged._decryptedParagraphs;
                            }
                            return merged;
                        }
                        return m;
                    });
                    buildToc();
                    if (hasNew && isAdminLoggedIn()) {
                        await decryptAllChaptersForAdmin(true);
                    }
                    if (hasNew || hasCurrentChanged) {
                        const curScroll = window.scrollY;
                        if (hasCurrentChanged && allChapters[currentChapIndex]) {
                            await ensureChapterLoaded(allChapters[currentChapIndex], true).catch(() => {});
                        }
                        await loadChapter(currentChapIndex, false);
                        window.scrollTo(0, curScroll);
                        console.log('[App] Chapters synced! Count:', freshMeta.length);
                        const btn = document.getElementById('btnRefresh');
                        if (btn && hasNew) {
                            btn.innerText = '✨ มีตอนใหม่ (' + freshMeta.length + ')';
                            setTimeout(() => { btn.innerText = '🔄 รีเฟรช'; }, 4000);
                        }
                    }
                }
            } catch (err) {
                console.log('[App] Background sync skipped (offline or network slow)');
            }
        }

        async function fetchChaptersWithTimeout(timeoutMs = 10000) {
            try {
                // 1. Try lightweight chapters_meta.json (~10 KB) with timeout
                const data = await fetchJsonWithTimeout('chapters_meta.json?v=' + Date.now(), timeoutMs, true);
                if (Array.isArray(data) && data.length > 0) return data;
            } catch (netErr) {
                console.warn('Network meta fetch failed or timed out:', netErr);
            }

            // 2. Fallback: Normal fetch without cache busting
            try {
                const fallbackData = await fetchJsonWithTimeout('chapters_meta.json', timeoutMs, false);
                if (Array.isArray(fallbackData) && fallbackData.length > 0) return fallbackData;
            } catch (fbErr) {
                console.warn('Fallback meta fetch failed:', fbErr);
            }

            // 3. Fallback: Direct CacheStorage read (Offline PWA)
            if ('caches' in window) {
                try {
                    const cached = await caches.match('chapters_meta.json', { ignoreSearch: true })
                                || await caches.match('./chapters_meta.json', { ignoreSearch: true })
                                || await caches.match('chapters.json', { ignoreSearch: true })
                                || await caches.match('./chapters.json', { ignoreSearch: true });
                    if (cached) {
                        return await cached.json();
                    }
                } catch (cacheErr) {
                    console.warn('Direct CacheStorage read failed:', cacheErr);
                }
            }

            throw new Error('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์หรือดึงข้อมูลจากแคชได้');
        }

        async function forceRefresh() {
            try {
                const btn = document.getElementById('btnRefresh');
                if (btn) btn.innerText = '⌛ กำลังโหลด...';
                allChapters = await fetchChaptersWithTimeout(10000);
                buildToc();
                if (allChapters[currentChapIndex]) {
                    await ensureChapterLoaded(allChapters[currentChapIndex], true);
                }
                await decryptAllChaptersForAdmin(true);
                await loadChapter(currentChapIndex, false);
                if (btn) btn.innerText = '✓ ล่าสุดแล้ว';
                setTimeout(() => { if (btn) btn.innerText = '🔄 รีเฟรช'; }, 2000);
            } catch (err) {
                alert('ไม่สามารถอัพเดทได้ในขณะนี้: ' + err.message);
                const btn = document.getElementById('btnRefresh');
                if (btn) btn.innerText = '🔄 รีเฟรช';
            }
        }

        async function init() {
            const savedTheme = localStorage.getItem('novel_theme') || 'sepia';
            changeTheme(savedTheme);

            const urlChap = parseInt(new URLSearchParams(window.location.search).get('ch') || '0', 10);
            const savedChap = urlChap > 0 ? urlChap : parseInt(localStorage.getItem('novel_last_chapter') || '1', 10);

            // STEP 1: Instant launch using embedded metadata (0ms, zero extra HTTP waterfall!)
            // Prefer cached metadata if it has newer/more chapters than embedded HTML
            let initialChapters = Array.isArray(EMBEDDED_CHAPTERS_META) && EMBEDDED_CHAPTERS_META.length > 0
                ? EMBEDDED_CHAPTERS_META.map(c => Object.assign({}, c))
                : null;

            if ('caches' in window) {
                try {
                    const cached = await caches.match('chapters_meta.json', { ignoreSearch: true })
                                || await caches.match('./chapters_meta.json', { ignoreSearch: true });
                    if (cached) {
                        const cachedChapters = await cached.json();
                        if (Array.isArray(cachedChapters) && (!initialChapters || cachedChapters.length > initialChapters.length)) {
                            initialChapters = cachedChapters;
                        }
                    }
                } catch (cacheErr) {}
            }

            if (initialChapters && initialChapters.length > 0) {
                const hasRequestedChap = urlChap <= 0 || initialChapters.some(c => c.id === urlChap);
                if (hasRequestedChap) {
                    allChapters = initialChapters;
                    const targetIdx = allChapters.findIndex(c => c.id === savedChap);
                    await loadChapter(targetIdx >= 0 ? targetIdx : 0, urlChap > 0 ? false : true);
                    decryptAllChaptersForAdmin();
                    // Check for new chapters silently AFTER current chapter renders
                    setTimeout(() => backgroundSyncChapters(), 1500);
                    return;
                }
            }

            // STEP 2: Fallback if requested chapter is newer than embedded/cached meta
            const reader = document.getElementById('readerArea');

        function getEffectiveVolumes() {
            let vols = [...VOLUMES];
            const maxEnd = Math.max(...VOLUMES.map(v => v.end), 0);
            const extraChapters = allChapters.filter(c => c.id > maxEnd);
            if (extraChapters.length > 0) {
                let currentStart = maxEnd + 1;
                const highestId = Math.max(...extraChapters.map(c => c.id));
                while (currentStart <= highestId) {
                    const currentEnd = currentStart + 24;
                    const vNum = Math.floor((currentStart - 1) / 25) + 1;
                    vols.push({
                        id: vNum,
                        tag: `เล่มที่ ${vNum} · ภาค ${vNum}`,
                        title: 'ภาคใหม่ (กำลังเผยแพร่)',
                        sub: `ตอนที่ ${currentStart}–${currentEnd}`,
                        cover: '',
                        icon: '📜',
                        start: currentStart,
                        end: currentEnd
                    });
                    currentStart = currentEnd + 1;
                }
            }
            return vols;
        }

            collapsedVolumes[volId] = !collapsedVolumes[volId];

        function buildToc(filterQuery, forceRender = false) {
            const modal = document.getElementById('tocModal');
            if (!forceRender && modal && !modal.classList.contains('open')) return;
            const container = document.getElementById('tocContainer');
            if (!container) return;

            const searchInput = document.getElementById('tocSearchInput');
            const query = (typeof filterQuery === 'string' ? filterQuery : (searchInput ? searchInput.value : '')).trim().toLowerCase();

            const effectiveVolumes = getEffectiveVolumes();
            const currentChap = allChapters[currentChapIndex];
            const currentChapId = currentChap ? currentChap.id : 1;
            const activeVolId = effectiveVolumes.find(v => currentChapId >= v.start && currentChapId <= v.end)?.id || 1;

            const htmlBlocks = effectiveVolumes.map(vol => {
                const isAdmin = isAdminLoggedIn();
                let volChapters = allChapters.filter(c => c.id >= vol.start && c.id <= vol.end);
                if (query) {
                    volChapters = volChapters.filter(c => {
                        const displayTitle = (isAdmin && c._decryptedTitle) ? c._decryptedTitle : (c.title || '');
                        return String(c.id).includes(query) || displayTitle.toLowerCase().includes(query);
                    });
                }
                if (volChapters.length === 0) return '';

                if (collapsedVolumes[vol.id] === undefined) {
                    collapsedVolumes[vol.id] = (vol.id !== activeVolId);
                }
                const isCollapsed = query ? false : collapsedVolumes[vol.id];

                let coverHtml = '';
                if (vol.cover) {
                    coverHtml = `
                        <div class="toc-hero-cover-wrap" onclick="event.stopPropagation(); showCoverLightbox(${vol.id});" title="คลิกเพื่อดูหน้าปกขนาดเต็ม">

                } else {
                    coverHtml = `
                        <div class="toc-hero-cover-wrap" style="font-size:28px;">
                            ${vol.icon || '📜'}

                    `;
                }

                const volTotalChars = volChapters.reduce((sum, c) => sum + getChapterCharStats(c).charCount, 0);
                const volCharsText = volTotalChars > 0 ? ` · ${volTotalChars.toLocaleString('th-TH')} ตัวอักษร` : '';

                const chaptersListHtml = volChapters.map(chap => {
                    const idx = allChapters.findIndex(c => c.id === chap.id);
                    const isActive = idx === currentChapIndex ? 'active' : '';
                    const isLockedForVisitor = Boolean(chap.locked && !isAdmin);
                    const displayTitle = (isAdmin && chap._decryptedTitle) ? chap._decryptedTitle : chap.title;
                    const stats = getChapterCharStats(chap);
                    const charBadge = stats.charCount > 0 ? `<span class="toc-char-badge">${stats.charCount.toLocaleString('th-TH')} อักษร</span>` : '';
                    const lockBadge = isLockedForVisitor ? '<span style="font-size:12px;opacity:0.75;">🔒</span>' : '';
                    const rightBadge = isActive
                        ? `<span style="display:flex;align-items:center;gap:6px;">${charBadge}<span style="font-size:12px;color:var(--accent);">📖 กำลังอ่าน</span></span>`
                        : `<span style="display:flex;align-items:center;gap:6px;">${charBadge}${lockBadge}</span>`;
                    return `
                        <li class="toc-item ${isActive}" onclick="selectChapter(${idx})">
                            <span>${displayTitle}</span>
                            ${rightBadge}
                        </li>
                    `;
                }).join('');

                return `
                    <div class="toc-volume-card ${isCollapsed ? 'collapsed' : ''}" id="vol-card-${vol.id}">
                        <div class="toc-hero-banner" onclick="toggleVolume(${vol.id})" title="คลิกเพื่อย่อ/ขยายเล่ม">

                            </div>
                            <div class="toc-vol-toggle" title="ย่อ/ขยายเล่ม">▼</div>
                        </div>
                        <ul class="toc-list">
                            ${chaptersListHtml}
                        </ul>
                    </div>
                `;
            }).filter(Boolean).join('');

            container.innerHTML = htmlBlocks || '<div style="text-align:center;padding:28px 12px;color:var(--text-muted);font-size:14px;">ไม่พบตอนที่ตรงกับคำค้นหา</div>';
        }

        function getChapterCharStats(rawChap, resolvedChap) {
            const target = resolvedChap || rawChap;
            if (rawChap && typeof rawChap.charCount === 'number') {
                return {
                    charCount: rawChap.charCount,
                    charCountNoSpace: typeof rawChap.charCountNoSpace === 'number' ? rawChap.charCountNoSpace : rawChap.charCount
                };
            }
            const paras = (target && Array.isArray(target.paragraphs))
                ? target.paragraphs
                : (rawChap && Array.isArray(rawChap._decryptedParagraphs) ? rawChap._decryptedParagraphs : null);
            if (!paras) return { charCount: 0, charCountNoSpace: 0 };
            const tmp = document.createElement('div');
            const parts = [];
            paras.forEach(p => {
                if (p.type === 'divider') return;
                tmp.innerHTML = p.text || '';
                parts.push(tmp.textContent || tmp.innerText || '');
            });
            const plain = parts.join('\n');
            return {
                charCount: plain.length,
                charCountNoSpace: plain.replace(/\s+/g, '').length
            };
        }

                    <button class="copy-tool-btn" id="copyBodyBtn" onclick="copyChapterBody(false)">📄 คัดลอก+ตัวเอียง (Dek-D)</button>
                    <button class="copy-tool-btn" id="copyBodyIndentBtn" onclick="copyChapterBody(true)">📝 คัดลอก+ตัวเอียง+ย่อหน้า (กวี/ธัญวลัย/RAW/FL)</button>
                    <button class="copy-tool-btn" id="copyTabBtn" onclick="copyChapterBodyPlainTab()">📑 คัดลอกแบบ Tab ล้วน</button>
                </div>
            `;
            chap.paragraphs.forEach(p => {
                if (p.type === 'divider') htmlStr += `<div class="divider">❖ ❖ ❖</div>`;
                else if (p.type === 'quote') htmlStr += `<div class="quote-box">${p.text}</div>`;
                else htmlStr += `<p>${p.text}</p>`;
            });

            // Nav Footer
            htmlStr += buildNavBar('nav-footer');

            document.getElementById('readerArea').innerHTML = htmlStr;
            buildToc();

            // Handle Scroll Restoration
            if (shouldRestoreScroll) {
                const savedY = parseFloat(localStorage.getItem(`novel_scroll_ch_${chap.id}`) || '0');
                if (savedY > 0) {
                    setTimeout(() => {
                        window.scrollTo({ top: savedY, behavior: 'instant' });
                    }, 50);
                } else {
                    window.scrollTo(0, 0);
                }
            } else {
                window.scrollTo(0, 0);
                localStorage.setItem(`novel_scroll_ch_${chap.id}`, '0');
            }
        }

        // Save scroll position on the fly
        let scrollTimeout;
        window.addEventListener('scroll', () => {
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPos = window.scrollY;
            const progress = docHeight > 0 ? (scrollPos / docHeight) * 100 : 0;
            document.getElementById('progressBar').style.width = progress + '%';

            clearTimeout(scrollTimeout);
            scrollTimeout = setTimeout(() => {
                if (allChapters[currentChapIndex]) {
                    const chapId = allChapters[currentChapIndex].id;
                    localStorage.setItem(`novel_scroll_ch_${chapId}`, scrollPos);
                }
            }, 150);
        });

        function openToc() {
            const effectiveVolumes = getEffectiveVolumes();
            const currentChap = allChapters[currentChapIndex];
            const activeVol = currentChap
                ? effectiveVolumes.find(v => currentChap.id >= v.start && currentChap.id <= v.end)
                : null;
            const activeVolId = activeVol ? activeVol.id : 1;

            // Reset accordion state so ONLY the active volume starts expanded
            collapsedVolumes = {};
            effectiveVolumes.forEach(v => {
                collapsedVolumes[v.id] = (v.id !== activeVolId);
            });

            const searchInput = document.getElementById('tocSearchInput');
            if (searchInput) searchInput.value = '';

            buildToc('', true);
            document.getElementById('tocModal').classList.add('open');
            if (isAdminLoggedIn() && allChapters.some(c => c && c.locked && !c._decryptedTitle)) {
                decryptAllChaptersForAdmin(false);
            }
            setTimeout(() => {
                const activeItem = document.querySelector('.toc-item.active');
                if (activeItem) {
                    activeItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
            }, 100);
        }

        function closeToc(e) {
            document.getElementById('tocModal').classList.remove('open');
        }

        function showCoverLightbox(volume = 1) {
            const effectiveVolumes = getEffectiveVolumes();
            const vol = effectiveVolumes.find(v => v.id === volume);
            if (vol && (vol.fullCover || vol.cover)) {
                const image = document.querySelector('#coverLightbox .lightbox-img');
                image.src = vol.fullCover || vol.cover;
                image.alt = 'หน้าปก เล่มที่ ' + volume + ' ขนาดเต็ม';
                document.getElementById('coverLightbox').classList.add('open');
            }
        }

        function closeCoverLightbox() {
            document.getElementById('coverLightbox').classList.remove('open');
        }

        function flashCopyBtn(btnId, successLabel, defaultLabel) {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.innerText = successLabel;
            btn.classList.add('copied');
            setTimeout(() => {
                btn.innerText = defaultLabel;
                btn.classList.remove('copied');
            }, 2200);
        }

        async function copyChapterTitle() {
            if (!isAdminLoggedIn()) return;
            const chap = currentResolvedChapter || allChapters[currentChapIndex];
            if (!chap) return;
            const tmp = document.createElement('div');
            tmp.innerHTML = chap.title;
            const plainTitle = (tmp.textContent || tmp.innerText || '').trim();
            try {
                await navigator.clipboard.writeText(plainTitle);
                flashCopyBtn('copyTitleBtn', '✅ คัดลอกชื่อตอนแล้ว!', '📋 คัดลอกชื่อตอน');
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = plainTitle;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                flashCopyBtn('copyTitleBtn', '✅ คัดลอกชื่อตอนแล้ว!', '📋 คัดลอกชื่อตอน');
            }
        }

        async function copyChapterBody(withIndent = false) {
            if (!isAdminLoggedIn()) return;
            const chap = currentResolvedChapter || allChapters[currentChapIndex];
            if (!chap) return;
            const htmlParts = [];
            const textParts = [];
            const tmp = document.createElement('div');
            const pStyle = withIndent ? ' style="text-indent: 2em;"' : '';
            const btnId = withIndent ? 'copyBodyIndentBtn' : 'copyBodyBtn';
            const defaultLabel = withIndent
                ? '📝 คัดลอก+ตัวเอียง+ย่อหน้า (กวี/ธัญวลัย/RAW/FL)'
                : '📄 คัดลอก+ตัวเอียง (Dek-D)';

            chap.paragraphs.forEach(p => {
                if (p.type === 'divider') {
                    htmlParts.push('<p style="text-align:center;">❖ ❖ ❖</p>');
                    textParts.push('❖ ❖ ❖');
                } else if (p.type === 'quote') {
                    htmlParts.push(`<blockquote>${p.text}</blockquote>`);
                    tmp.innerHTML = p.text;
                    textParts.push((withIndent ? '\t' : '') + (tmp.textContent || tmp.innerText || '').trim());
                } else {
                    htmlParts.push(`<p${pStyle}>${p.text}</p>`);
                    tmp.innerHTML = p.text;
                    textParts.push((withIndent ? '\t' : '') + (tmp.textContent || tmp.innerText || '').trim());
                }
            });

            const richHtml = htmlParts.join('');
            const plainText = textParts.join('\n');

            try {
                if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
                    const item = new ClipboardItem({
                        'text/html': new Blob([richHtml], { type: 'text/html' }),
                        'text/plain': new Blob([plainText], { type: 'text/plain' })
                    });
                    await navigator.clipboard.write([item]);
                } else {
                    await navigator.clipboard.writeText(plainText);
                }
                flashCopyBtn(btnId, '✅ คัดลอกเนื้อหาแล้ว!', defaultLabel);
            } catch (err) {
                const holder = document.createElement('div');
                holder.contentEditable = true;
                holder.style.position = 'fixed';
                holder.style.left = '-9999px';
                holder.innerHTML = richHtml;
                document.body.appendChild(holder);
                const range = document.createRange();
                range.selectNodeContents(holder);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                document.execCommand('copy');
                sel.removeAllRanges();
                document.body.removeChild(holder);
                flashCopyBtn(btnId, '✅ คัดลอกเนื้อหาแล้ว!', defaultLabel);
            }
        }

        async function copyChapterBodyPlainTab() {
            if (!isAdminLoggedIn()) return;
            const chap = currentResolvedChapter || allChapters[currentChapIndex];
            if (!chap) return;
            const textParts = [];
            const tmp = document.createElement('div');

            chap.paragraphs.forEach(p => {
                if (p.type === 'divider') {
                    textParts.push('❖ ❖ ❖');
                } else {
                    tmp.innerHTML = p.text || '';
                    textParts.push('\t' + (tmp.textContent || tmp.innerText || '').trim());
                }
            });

            const plainText = textParts.join('\n');
            const defaultLabel = '📑 คัดลอกแบบ Tab ล้วน';
            try {
                await navigator.clipboard.writeText(plainText);
                flashCopyBtn('copyTabBtn', '✅ คัดลอกแบบ Tab แล้ว!', defaultLabel);
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = plainText;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                flashCopyBtn('copyTabBtn', '✅ คัดลอกแบบ Tab แล้ว!', defaultLabel);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            if (e.key === 'Escape') {
                closeToc();
                closeCoverLightbox();
            } else if (e.key === 'ArrowLeft' && currentChapIndex > 0) {
                loadChapter(currentChapIndex - 1, false);
            } else if (e.key === 'ArrowRight' && currentChapIndex < allChapters.length - 1) {
                loadChapter(currentChapIndex + 1, false);
            }
        });

        init();
    </script>
</body>
</html>
